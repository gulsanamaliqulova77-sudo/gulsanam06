
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yotoqxona.uz | Tizimga kirish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Yotoqxona.uz</h1>

            <p class="login-description">
                Talabalar turar joyi platformasiga xush kelibsiz!
            </p>

            <h2>Tizimga kirish</h2>

            <form id="loginForm">

                <label for="loginEmail">Elektron pochta</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="email@example.com"
                    required
                >

                <label for="loginPassword">Parol</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Parolingizni kiriting"
                    required
                >

                <button type="submit">Kirish</button>

            </form>

            <p class="register-link">
                Hisobingiz yo‘qmi?
                <a href="register.html">Ro‘yxatdan o‘tish</a>
            </p>

            <a href="index.html" class="back-home">
                Bosh sahifaga qaytish
            </a>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
